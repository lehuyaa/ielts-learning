info:
  contact: {}
  description: Backend API for IELTS Vocabulary Learning Platform
  title: IELTS Learning API
  version: v1
paths:
  /activities/{activityId}:
    get:
      consumes:
      - application/json
      description: Return an activity with its exercises (prompt and public payload
        only — never the answers) and the answers already given in the current attempt.
      parameters:
      - description: Activity ID
        in: path
        name: activityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/lessonactivity.ActivityDetailResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get activity
      tags:
      - Activities
  /activities/{activityId}/answers:
    post:
      consumes:
      - application/json
      description: Grade one exercise answer and return immediate feedback. The answer
        shape depends on the exercise type (docs/foundation-spec.md §5.1).
      parameters:
      - description: Activity ID
        in: path
        name: activityId
        required: true
        type: integer
      - description: Answer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lessonactivity.SubmitAnswerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/lessonactivity.AnswerResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Answer an exercise
      tags:
      - Activities
  /activities/{activityId}/complete:
    post:
      consumes:
      - application/json
      description: Score the current attempt, pass or fail the activity, award XP
        on the first pass, and complete the lesson when every required activity is
        passed.
      parameters:
      - description: Activity ID
        in: path
        name: activityId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/lessonactivity.CompleteActivityResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Finish an activity attempt
      tags:
      - Activities
  /admin/content/extract:
    post:
      consumes:
      - multipart/form-data
      description: Upload up to 10 page images or one PDF (multipart "files"). A vision
        model extracts grammar explanations and exercises into a content bundle draft
        (activities are DRAFT unless publish=true) to review in the import preview.
        Nothing is written to the database.
      parameters:
      - description: Page images or one PDF
        in: formData
        name: files
        required: true
        type: file
      - description: Default foundation-english
        in: formData
        name: courseSlug
        type: string
      - description: Default A1
        in: formData
        name: cefrLevel
        type: string
      - description: Topic slug for the extracted lesson
        in: formData
        name: topicSlug
        type: string
      - description: Topic title
        in: formData
        name: topicTitle
        type: string
      - description: Extra instructions for the AI
        in: formData
        name: notes
        type: string
      - description: Publish activities right away
        in: formData
        name: publish
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/contentimport.ExtractResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Extract lesson content from pages
      tags:
      - Admin
  /admin/content/import:
    post:
      consumes:
      - multipart/form-data
      description: Validate a lesson content bundle and write every valid topic, lesson,
        activity and exercise in one transaction. Invalid items are skipped.
      parameters:
      - description: Content bundle (.json, max 5MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/contentimport.ImportResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Import a content bundle
      tags:
      - Admin
  /admin/content/import/preview:
    post:
      consumes:
      - multipart/form-data
      description: Validate a lesson content bundle (JSON, multipart field "file")
        and report what would be created, updated or skipped. Does not write to the
        database.
      parameters:
      - description: Content bundle (.json, max 5MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/contentimport.ImportResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Preview a content bundle import
      tags:
      - Admin
  /admin/passages:
    post:
      consumes:
      - application/json
      description: Validate a passage (e.g. an edited transcription draft) and create
        or update it by slug.
      parameters:
      - description: Passage
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/contentimport.PassageInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/lessonactivity.PassageCard'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Save a passage
      tags:
      - Admin
  /admin/passages/transcribe:
    post:
      consumes:
      - multipart/form-data
      description: Upload an audio file (multipart "file", max 25MB, mp3/m4a/wav/webm/ogg).
        It is stored under /media/passages and sent to Whisper; the reply is a passage
        draft (text + sentence segments with times) to edit and save. Nothing is written
        to the database.
      parameters:
      - description: Audio file
        in: formData
        name: file
        required: true
        type: file
      - description: Passage title
        in: formData
        name: title
        type: string
      - description: 'Passage slug (default: from the title)'
        in: formData
        name: slug
        type: string
      - description: DIALOGUE, MONOLOGUE, ...
        in: formData
        name: genre
        type: string
      - description: Book / unit / page
        in: formData
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/contentimport.PassageDraft'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Transcribe a recording into a passage draft
      tags:
      - Admin
  /admin/vocabularies/import:
    post:
      consumes:
      - multipart/form-data
      description: 'Parse, validate, and commit an uploaded Excel file of vocabulary
        rows: upserts each vocabulary by slug and assigns it to the given topic/lesson.
        Admin only.'
      parameters:
      - description: Excel file (.xlsx) with vocabulary rows
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/vocabulary.ImportResultResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Commit a vocabulary Excel import
      tags:
      - Vocabularies
  /admin/vocabularies/import/preview:
    post:
      consumes:
      - multipart/form-data
      description: Parse and validate an uploaded Excel file of vocabulary rows without
        writing to the database. Admin only.
      parameters:
      - description: Excel file (.xlsx) with vocabulary rows
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/vocabulary.ImportResultResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Preview a vocabulary Excel import
      tags:
      - Vocabularies
  /ai-conversations/scenarios:
    get:
      consumes:
      - application/json
      description: Return the authenticated user's AI Conversation scenarios.
      produces:
