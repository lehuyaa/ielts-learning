      tags:
      - Vocabularies
  /words/{vocabularyId}/flashcard:
    post:
      description: Put a vocabulary word into the learner's reviews (status NEW, due
        now). Adding a word that is already there changes nothing.
      parameters:
      - description: Vocabulary ID
        in: path
        name: vocabularyId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/passage.AddFlashcardResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a word to flashcards
      tags:
      - Passages
  /words/lookup:
    get:
      description: 'Tap-to-translate: meaning, IPA and audio of a word from a text,
        using the passage glossary first and then the vocabulary (base forms of plurals,
        -ed, -ing).'
      parameters:
      - description: Word as written in the text
        in: query
        name: word
        required: true
        type: string
      - description: Passage whose glossary is checked first
        in: query
        name: passageId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/passage.WordLookupResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Look up a tapped word
      tags:
      - Passages
  /writing/submissions:
    post:
      consumes:
      - application/json
      description: The AI scores the text (task, grammar, vocabulary, coherence; overall
        = 10 × average) and marks each mistake with its position, correction and a
        Vietnamese explanation. Mistakes are logged for review. A text with mistakes
        must be rewritten before the activity can be completed.
      parameters:
      - description: Activity and text
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lessonactivity.SubmitWritingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/lessonactivity.WritingSubmissionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit a text for a WRITING activity
      tags:
      - Activities
  /writing/submissions/{submissionId}/rewrite:
    post:
      consumes:
      - application/json
      description: Checks the corrected text; the submission is COMPLETED when no
        mistakes remain (otherwise the remaining ones are returned in rewriteReport).
      parameters:
      - description: Writing submission ID
        in: path
        name: submissionId
        required: true
        type: integer
      - description: Rewritten text
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lessonactivity.RewriteWritingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/lessonactivity.WritingSubmissionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit the rewrite of a text
      tags:
      - Activities
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by a JWT access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
